<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的吧台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ===== CSS 变量 ===== */
:root {
  --bg: #0f0f0f;
  --bg-card: #1a1a1a;
  --bg-card-hover: #232323;
  --bg-input: #1c1c1a;
  --text: #f5f5dc;
  --text-secondary: #999988;
  --accent: #d97706;
  --accent-hover: #e88a1e;
  --danger: #7c2d12;
  --success: #5a8f3a;
  --tab-height: 60px;
  --font-base: 14px;
  --font-lg: 18px;
  --font-xl: 22px;
  --font-sm: 12px;
  --radius-card: 12px;
  --radius-btn: 8px;
  --btn-min-height: 44px;
  --font-heading: 'Noto Serif SC', 'Songti SC', '宋体', serif;
  --font-body: -apple-system, 'PingFang SC', '苹方', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Roboto Mono', 'Courier New', monospace;
}

/* ===== 全局 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  font-size: var(--font-base);
  color: var(--text);
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overflow: hidden;
}
input, textarea, select, button {
  font-family: inherit; font-size: inherit; color: inherit;
  border: none; outline: none; background: none;
}
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, textarea {
  background: var(--bg-input);
  border-radius: var(--radius-btn);
  padding: 10px 12px;
  width: 100%;
  color: var(--text);
}
textarea { resize: vertical; min-height: 60px; }
input:focus, textarea:focus { box-shadow: 0 0 0 2px var(--accent); }

/* ===== 布局 ===== */
#app { height: 100%; display: flex; flex-direction: column; }
.tab-content { flex: 1; overflow-y: auto; padding: 16px 16px 80px; display: none; }
.tab-content.active { display: block; }

/* ===== Tab 栏 ===== */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--tab-height);
  display: flex;
  background: var(--bg-card);
  border-top: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: var(--font-sm);
  transition: color 0.15s;
}
.tab-btn .tab-icon { font-size: 20px; margin-bottom: 2px; }
.tab-btn.active { color: var(--accent); }

/* ===== 卡片 ===== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-card);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  transition: all 0.2s ease;
}
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.card-title { font-size: var(--font-lg); font-weight: 600; font-family: var(--font-heading); }
.card-subtitle { font-size: var(--font-sm); color: var(--text-secondary); }
.card-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

/* ===== 按钮 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--btn-min-height); padding: 8px 16px;
  border-radius: var(--radius-btn); font-weight: 600;
  transition: all 0.2s ease;
}
.btn:active { opacity: 0.7; transform: translateY(1px); }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { border: 1px solid var(--text-secondary); color: var(--text); }
.btn-outline:hover { border-color: var(--text); }
.btn-outline.active { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 2px 8px rgba(217,119,6,0.3); }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: var(--font-sm); }
.btn-lg { min-height: 52px; padding: 12px 24px; font-size: var(--font-lg); width: 100%; }
.btn-block { width: 100%; }

/* ===== 标签/徽章 ===== */
.tag {
  display: inline-block; padding: 3px 8px; border-radius: 20px;
  font-size: var(--font-sm); background: rgba(255,255,255,0.08);
  color: var(--text-secondary); margin: 2px;
}
.tag.accent { background: var(--accent); color: #fff; }
.tag.active { background: rgba(255,107,53,0.2); color: var(--accent); }
.tag-remove { margin-left: 4px; cursor: pointer; opacity: 0.5; }
.tag-remove:hover { opacity: 1; }

/* ===== 模态框 ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  width: 100%; max-width: 500px; max-height: 90vh;
  overflow-y: auto; padding: 20px 16px 30px;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.modal-title { font-size: var(--font-lg); font-weight: 600; font-family: var(--font-heading); }
.modal-close { font-size: 24px; color: var(--text-secondary); padding: 4px; line-height: 1; }

/* ===== 全屏详情页 ===== */
.full-page {
  position: fixed; inset: 0; z-index: 150;
  background: var(--bg); overflow-y: auto;
  display: none; flex-direction: column;
  padding: 16px 16px 40px;
}
.full-page.open { display: flex; }
.page-header {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 16px; position: sticky; top: 0; z-index: 10;
  background: var(--bg);
}
.page-back { font-size: 24px; padding: 4px 8px; color: var(--text); }
.page-title { font-size: var(--font-xl); font-weight: 600; flex: 1; font-family: var(--font-heading); }
.page-section { margin-top: 20px; }
.page-section-title {
  font-size: var(--font-base); color: var(--text-secondary);
  margin-bottom: 10px; letter-spacing: 1px;
  font-family: var(--font-heading);
}

/* ===== 销售向导步骤 ===== */
.wizard-step { display: none; }
.wizard-step.active { display: block; }
.wizard-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  margin-top: 12px;
}
.wizard-item {
  background: var(--bg-input); border-radius: var(--radius-btn);
  padding: 14px 10px; text-align: center; font-weight: 500;
  transition: background 0.1s;
}
.wizard-item:active { background: var(--accent); }
.wizard-item.selected { background: var(--accent); }
.wizard-search { margin-bottom: 8px; }
.quantity-row {
  display: flex; align-items: center; gap: 16px; margin: 16px 0;
  justify-content: center;
}
.qty-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--bg-input); font-size: 24px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.qty-btn:active { background: var(--accent); }
.qty-val { font-size: 28px; font-weight: 700; min-width: 40px; text-align: center; }

/* ===== 报表 ===== */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius-card); padding: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.stat-val { font-size: 24px; font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
.stat-label { font-size: var(--font-sm); color: var(--text-secondary); margin-top: 2px; }

.bar-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar-label { flex: 0 0 70px; font-size: var(--font-sm); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 22px; background: var(--bg-input); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; min-width: 2px; transition: width 0.3s; }
.bar-value { flex: 0 0 80px; font-size: var(--font-sm); color: var(--text-secondary); text-align: left; }

.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-row .btn { flex: 0 0 auto; }

/* ===== 日历 ===== */
.calendar { background: var(--bg-card); border-radius: var(--radius-card); padding: 12px; }
.cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: var(--font-sm); color: var(--text-secondary); margin-bottom: 4px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 6px; font-size: var(--font-sm); }
.cal-cell.empty { pointer-events: none; }
.cal-cell.today { border: 1px solid var(--accent); }
.cal-cell.has-data { background: rgba(255,107,53,0.15); cursor: pointer; }
.cal-rev { font-size: 9px; color: var(--accent); }

/* ===== 星评 ===== */
.stars { display: inline-flex; gap: 2px; }
.star { font-size: 20px; cursor: pointer; color: var(--text-secondary); }
.star.on { color: #f5a623; }

/* ===== 操作抽屉 ===== */
.action-sheet-overlay {
  position: fixed; inset: 0; z-index: 250;
  background: rgba(0,0,0,0.5);
  display: none; align-items: flex-end; justify-content: center;
}
.action-sheet-overlay.open { display: flex; }
.action-sheet {
  background: var(--bg-card);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 500px; padding: 8px 16px 24px;
}
.action-sheet-btn {
  display: block; width: 100%; padding: 14px 0;
  text-align: center; font-size: var(--font-lg); font-weight: 500;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  color: var(--text);
}
.action-sheet-btn:last-child { border-bottom: none; }
.action-sheet-btn.danger { color: var(--danger); }
.action-sheet-btn.cancel { color: var(--text-secondary); font-size: var(--font-base); margin-top: 4px; }

/* ===== 搜索框 ===== */
.search-box { margin-bottom: 12px; }

/* ===== 评价按钮 ===== */
.rating-btns { display: flex; gap: 6px; margin-top: 6px; }
.rating-btn { font-size: 16px; padding: 2px 8px; border-radius: 4px; background: transparent; opacity: 0.3; cursor: pointer; transition: all 0.15s; line-height: 1.4; }
.rating-btn.on { opacity: 1; }
.rating-btn.like.on { background: rgba(90,143,58,0.2); }
.rating-btn.dislike.on { background: rgba(124,45,18,0.2); }

/* ===== Tab 特定样式 ===== */
.tonight-summary {
  background: var(--bg-card); border-radius: var(--radius-card);
  padding: 14px; text-align: center; margin-top: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.tonight-summary .big-num { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
.sale-item { border-left: 3px solid var(--accent); }
.sale-item .card-subtitle { margin-top: 2px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

/* ===== 引言区域 ===== */
.quote-area {
  text-align: center; padding: 32px 20px;
  background: linear-gradient(180deg, rgba(217,119,6,0.03) 0%, rgba(217,119,6,0.06) 50%, rgba(217,119,6,0.02) 100%);
  border-radius: var(--radius-card);
  box-shadow: 0 2px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.02);
  margin-bottom: 20px;
  animation: fadeIn 0.6s ease;
}
.quote-text {
  font-family: var(--font-heading);
  font-size: 18px;
  line-height: 1.8;
  color: rgba(245,245,220,0.82);
  letter-spacing: 0.5px;
}
.quote-author {
  font-family: var(--font-body);
  font-size: 12px;
  color: rgba(245,245,220,0.38);
  margin-top: 14px;
  letter-spacing: 1px;
}

/* ===== 数字专用 ===== */
.big-num, .stat-val, .qty-val, .cal-rev {
  font-family: var(--font-mono);
  font-weight: 700;
}

/* ===== 动画 ===== */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateX(8px); }
  to { opacity: 1; transform: translateX(0); }
}
.tab-content.active {
  animation: fadeSlideIn 0.3s ease;
}

.recipe-tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

.recommend-card { border-left: 3px solid var(--success); }
.recommend-reason { font-size: var(--font-sm); color: var(--text-secondary); margin-top: 4px; font-style: italic; }

/* ===== 响应式 - PC 端 ===== */
@media (min-width: 768px) {
  body { display: flex; justify-content: center; }
  #app { max-width: 500px; width: 100%; border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }
  .tab-bar { left: calc(50% - 250px); right: calc(50% - 250px); }
  .modal { border-radius: var(--radius-card); margin: auto; max-height: 80vh; }
  .modal-overlay { align-items: center; }
}
</style>
</head>
<body>
<div id="app">

<!-- ===== Tab 今晚 ===== -->
<div class="tab-content active" id="tab-tonight">
  <div id="tonight-area"></div>
  <div id="tonight-sales"></div>
  <div id="tonight-footer"></div>
</div>

<!-- ===== Tab 客人 ===== -->
<div class="tab-content" id="tab-customers">
  <div class="filter-row">
    <button class="btn btn-primary" id="btn-add-customer">+ 新增客人</button>
  </div>
  <input class="search-box" id="customer-search" placeholder="搜索客人…">
  <div id="customers-list"></div>
</div>

<!-- ===== Tab 配方 ===== -->
<div class="tab-content" id="tab-recipes">
  <div class="filter-row">
    <button class="btn btn-primary" id="btn-add-recipe">+ 新增配方</button>
    <select id="recipe-tag-filter" style="background:var(--bg-input);border-radius:var(--radius-btn);padding:8px 12px;color:var(--text);">
      <option value="">全部标签</option>
    </select>
  </div>
  <input class="search-box" id="recipe-search" placeholder="搜索酒名…">
  <div id="recipes-list"></div>
</div>

<!-- ===== Tab 报表 ===== -->
<div class="tab-content" id="tab-reports">
  <div class="filter-row" id="report-filters">
    <button class="btn btn-outline btn-sm active" data-period="today">今天</button>
    <button class="btn btn-outline btn-sm" data-period="week">本周</button>
    <button class="btn btn-outline btn-sm" data-period="month">本月</button>
    <button class="btn btn-outline btn-sm" data-period="year">本年</button>
    <button class="btn btn-outline btn-sm" data-period="custom">自定义</button>
  </div>
  <div id="report-custom-dates" style="display:none;margin-bottom:12px;gap:8px;">
    <input type="date" id="report-date-from">
    <input type="date" id="report-date-to">
    <button class="btn btn-primary btn-sm" id="btn-apply-custom">确定</button>
  </div>
  <div id="reports-content"></div>
</div>

<!-- ===== Tab 栏 ===== -->
<nav class="tab-bar">
  <button class="tab-btn active" data-tab="tonight">
    <span class="tab-icon">🍸</span>今晚
  </button>
  <button class="tab-btn" data-tab="customers">
    <span class="tab-icon">👥</span>客人
  </button>
  <button class="tab-btn" data-tab="recipes">
    <span class="tab-icon">📖</span>配方
  </button>
  <button class="tab-btn" data-tab="reports">
    <span class="tab-icon">📊</span>报表
  </button>
</nav>

<!-- ===== 新增销售模态框（三步向导） ===== -->
<div class="modal-overlay" id="modal-sale">
  <div class="modal" id="sale-modal-inner">
    <div class="modal-header">
      <button class="modal-close" id="sale-close">&times;</button>
      <span class="modal-title" id="sale-title">新增销售</span>
      <div style="width:24px"></div>
    </div>
    <!-- Step 1: 选客人 -->
    <div class="wizard-step active" id="sale-step1">
      <div class="wizard-grid" id="customer-grid">
        <div class="wizard-item" data-customer-id="" data-customer-name="散客">散客</div>
      </div>
    </div>
    <!-- Step 2: 选酒 -->
    <div class="wizard-step" id="sale-step2">
      <input class="wizard-search" id="drink-search" placeholder="搜索酒…">
      <div class="wizard-grid" id="drink-grid"></div>
      <button class="btn btn-outline btn-block" style="margin-top:8px" id="btn-manual-drink">手动输入酒名</button>
      <div id="manual-drink-input" style="display:none;margin-top:8px;">
        <input id="manual-drink-name" placeholder="酒名">
        <input id="manual-drink-price" type="number" placeholder="单价" style="margin-top:8px" value="0" step="0.01">
        <button class="btn btn-primary btn-block" style="margin-top:8px" id="btn-confirm-manual">确认</button>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:4px" id="btn-cancel-manual">从配方列表选择</button>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px" id="sale-back-to-step1">上一步</button>
    </div>
    <!-- Step 3: 确认 -->
    <div class="wizard-step" id="sale-step3">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:var(--font-lg);font-weight:600" id="sale3-customer"></div>
        <div style="color:var(--accent);margin-top:4px" id="sale3-drink"></div>
      </div>
      <div class="quantity-row">
        <button class="qty-btn" id="sale-cups-minus">−</button>
        <span class="qty-val" id="sale-cups">1</span>
        <button class="qty-btn" id="sale-cups-plus">+</button>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:var(--font-sm);color:var(--text-secondary)">单价 ¥</label>
        <input type="number" id="sale-price" step="0.01" style="text-align:center;font-size:var(--font-lg);font-weight:600">
      </div>
      <div style="text-align:center;font-size:var(--font-lg);margin-bottom:16px">
        合计 <strong style="color:var(--accent)" id="sale-total">¥0</strong>
      </div>
      <button class="btn btn-primary btn-lg" id="sale-save">保存</button>
      <button class="btn btn-outline btn-sm btn-block" style="margin-top:8px" id="sale-back-to-step2">上一步</button>
    </div>
  </div>
</div>

<!-- ===== 客人表单模态框 ===== -->
<div class="modal-overlay" id="modal-customer">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="customer-form-close">&times;</button>
      <span class="modal-title" id="customer-form-title">新增客人</span>
      <div style="width:24px"></div>
    </div>
    <input id="customer-form-name" placeholder="客人名字">
    <textarea id="customer-form-notes" placeholder="备注（印象、忌口、生日等）" style="margin-top:8px"></textarea>
    <div style="margin-top:8px">
      <input id="customer-form-tag-input" placeholder="添加标签，回车确认">
      <div id="customer-form-tags" style="margin-top:4px"></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" id="customer-form-save">保存</button>
    <input type="hidden" id="customer-form-id">
  </div>
</div>

<!-- ===== 配方表单模态框 ===== -->
<div class="modal-overlay" id="modal-recipe">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="recipe-form-close">&times;</button>
      <span class="modal-title" id="recipe-form-title">新增配方</span>
      <div style="width:24px"></div>
    </div>
    <input id="recipe-form-name" placeholder="酒名">
    <input id="recipe-form-price" type="number" step="0.01" placeholder="默认价格" style="margin-top:8px">
    <input id="recipe-form-cost" type="number" step="0.01" placeholder="估算成本" style="margin-top:8px">
    <div style="margin-top:8px">
      <label style="font-size:var(--font-sm);color:var(--text-secondary)">基酒类型</label>
      <div id="recipe-form-base-tags" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px"></div>
    </div>
    <div style="margin-top:8px">
      <label style="font-size:var(--font-sm);color:var(--text-secondary)">口味</label>
      <div id="recipe-form-flavor-tags" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px"></div>
    </div>
    <div style="margin-top:8px">
      <input id="recipe-form-custom-tag" placeholder="自定义标签，回车确认">

function toSnakeCase(obj) {
  const r = {};
  for (const k of Object.keys(obj)) {
    r[k.replace(/[A-Z]/g, m => '_' + m.toLowerCase())] = obj[k];
  }
  return r;
}
function toCamelCase(obj) {
  const r = {};
  for (const k of Object.keys(obj)) {
    r[k.replace(/_([a-z])/g, (_, c) => c.toUpperCase())] = obj[k];
  }
  return r;
}

let _syncTimer = null;
function syncAllSupabase() {
  if (!sb) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    try {
      if (DB.customers.length) await sb.from('customers').upsert(DB.customers.map(toSnakeCase));
      if (DB.recipes.length) await sb.from('recipes').upsert(DB.recipes.map(toSnakeCase));
      if (DB.sales.length) await sb.from('sales').upsert(DB.sales.map(toSnakeCase));
      if (DB.ratings.length) await sb.from('ratings').upsert(DB.ratings.map(toSnakeCase));
      if (DB.sessions.length) await sb.from('sessions').upsert(DB.sessions.map(toSnakeCase));
    } catch(e) { console.error('Sync error:', e); }
  }, 300);
}

async function syncToSupabase(table, data) {
  if (!sb) return;
  try { await sb.from(table).upsert(data); } catch(e) { console.error('Sync error:', e); }
}

async function deleteFromSupabase(table, id) {
  if (!sb) return;
  try { await sb.from(table).delete().eq('id', id); } catch(e) { console.error('Delete error:', e); }
}

async function loadFromSupabase() {
  try {
    const tables = ['customers', 'recipes', 'sales', 'ratings', 'sessions'];
    const results = await Promise.all(
      tables.map(t => sb.from(t).select('*').limit(10000))
    );
    DB.customers = (results[0].data || []).map(toCamelCase);
    DB.recipes = (results[1].data || []).map(toCamelCase);
    DB.sales = (results[2].data || []).map(toCamelCase);
    DB.ratings = (results[3].data || []).map(toCamelCase);
    DB.sessions = (results[4].data || []).map(toCamelCase);
    dbSave();
    return true;
  } catch(e) {
    console.error('Supabase load failed, using localStorage:', e);
    return false;
  }
}

// ===== 推荐引擎 =====
function getCustomerProfile(customerId) {
  const sales = DB.sales.filter(s => s.customerId === customerId && s.recipeId && s.rating === 'like');
  const profile = { baseTypes: {}, flavors: {}, customTags: {}, totalCups: 0 };

  for (const sale of sales) {
    const recipe = getRecipe(sale.recipeId);
    if (!recipe) continue;
    profile.totalCups += sale.cups;
    for (const tag of recipe.tags) {
      if (BASE_LIQUORS.includes(tag)) {
        profile.baseTypes[tag] = (profile.baseTypes[tag] || 0) + sale.cups;
      } else if (FLAVORS.includes(tag)) {
        profile.flavors[tag] = (profile.flavors[tag] || 0) + sale.cups;
      } else {
        profile.customTags[tag] = (profile.customTags[tag] || 0) + sale.cups;
      }
    }
  }
  return profile;
}

function hasLikedDrinks(customerId) {
  return DB.sales.some(s => s.customerId === customerId && s.recipeId && s.rating === 'like');
}

function getLikedDrinks(customerId, n) {
  const sales = DB.sales.filter(s => s.customerId === customerId && s.recipeId && s.rating === 'like');
  const counts = {};
  for (const sale of sales) {
    counts[sale.recipeId] = (counts[sale.recipeId] || 0) + sale.cups;
  }
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n)
    .map(([recipeId, cups]) => ({ recipe: getRecipe(recipeId), cups }));
}

function recommendDrinks(customerId, count) {
  count = count || CONFIG.recommendCount;
  if (!hasLikedDrinks(customerId)) return [];

  const profile = getCustomerProfile(customerId);
  const triedIds = new Set(DB.sales.filter(s => s.customerId === customerId && s.recipeId).map(s => s.recipeId));
  const dislikedIds = new Set(DB.sales.filter(s => s.customerId === customerId && s.recipeId && s.rating === 'dislike').map(s => s.recipeId));

  const candidates = [];
  for (const recipe of DB.recipes) {
    if (triedIds.has(recipe.id) || dislikedIds.has(recipe.id)) continue;
    let score = 0;
    const matchedTags = [];
    for (const tag of recipe.tags) {
      let w = 0;
      if (profile.baseTypes[tag]) w = profile.baseTypes[tag] * CONFIG.weightBaseType;
      else if (profile.flavors[tag]) w = profile.flavors[tag] * CONFIG.weightFlavor;
      else if (profile.customTags[tag]) w = profile.customTags[tag] * CONFIG.weightCustom;
      if (w > 0) { score += w; matchedTags.push(tag); }
    }
    if (score > 0) candidates.push({ recipe, score, matchedTags });
  }

  candidates.sort((a, b) => b.score - a.score);
  return candidates.slice(0, count).map(c => ({
    ...c.recipe,
    _reason: genReason(profile, c.recipe, c.matchedTags)
  }));
}

function genReason(profile, recipe, matchedTags) {
  const baseMatch = matchedTags.find(t => BASE_LIQUORS.includes(t));
  const flavorMatch = matchedTags.find(t => FLAVORS.includes(t));
  if (baseMatch && flavorMatch) return `你常喝${baseMatch}基酒且偏爱${flavorMatch}口味，这杯组合类似`;
  if (baseMatch) return `你常喝${baseMatch}基酒，这杯也是${baseMatch}为基酒`;
  if (flavorMatch) return `你偏爱${flavorMatch}口味，这杯风味相近`;
  return '基于你的口味偏好推荐';
}

let reportPeriod = 'today';
let reportCustomFrom = null;
let reportCustomTo = null;

function getReportRange() {
  const now = new Date();
  let from, to;
  switch (reportPeriod) {
    case 'today':
      from = todayStr();
      to = todayStr();
      break;
    case 'week': {
      const d = new Date(now);
      d.setDate(d.getDate() - d.getDay() + 1); // Monday
      from = fmtDate(d.toISOString());
      to = todayStr();
      break;
    }
    case 'month':
      from = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
      to = todayStr();
      break;
    case 'year':
      from = `${now.getFullYear()}-01-01`;
      to = todayStr();
      break;
    case 'custom':
      from = reportCustomFrom || todayStr();
      to = reportCustomTo || todayStr();
      break;
  }
  return { from, to };
}

function renderReports() {
  const { from, to } = getReportRange();
  const sales = DB.sales.filter(s => {
    const d = s.createdAt ? s.createdAt.slice(0, 10) : '';

  const totalMoney = sales.reduce((s, x) => s + x.total, 0);

  const totalProfit = sales.reduce((s, x) => s + (x.recipeProfitAtSale || 0) * x.cups, 0);
  const margin = totalMoney > 0 ? (totalProfit / totalMoney * 100) : 0;
  const customerSet = new Set(sales.filter(s => s.customerId).map(s => s.customerId));
  const guestCount = customerSet.size + sales.filter(s => !s.customerId).length;
  const avgPerCustomer = guestCount > 0 ? totalMoney / guestCount : 0;

  let html = '';

  // 统计卡片

    <div class="stat-card"><div class="stat-val">${fmtMoney(totalProfit)}</div><div class="stat-label">总利润</div></div>
    <div class="stat-card"><div class="stat-val">${fmtMoney(totalCost)}</div><div class="stat-label">总成本</div></div>
    <div class="stat-card"><div class="stat-val">${margin.toFixed(1)}%</div><div class="stat-label">毛利率</div></div>
    <div class="stat-card"><div class="stat-val">${totalCups}</div><div class="stat-label">总杯数</div></div>
    <div class="stat-card"><div class="stat-val">${guestCount}</div><div class="stat-label">客流量</div></div>
  </div>`;

  // Top 5 酒
  const drinkCounts = {};
  sales.forEach(s => { drinkCounts[s.recipeName] = (drinkCounts[s.recipeName] || 0) + s.cups; });
  const topDrinks = Object.entries(drinkCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const maxDrink = topDrinks.length > 0 ? topDrinks[0][1] : 1;

  } else {

      return `<div class="bar-item">
        <span class="bar-label">${escHtml(name)}</span>

        <span class="bar-value">${cups}杯 ${fmtMoney(money)}</span>

  // Top 5 客人

function renderCalendar() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth(); // 0-based

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay() || 7; // Mon=1..Sun=7
  const daysInMonth = lastDay.getDate();

  // 每日流水
  const dailyRevenue = {};
  for (const session of DB.sessions) {
    const d = session.date;
    const sessionSales = DB.sales.filter(s => s.sessionId === session.id);
    dailyRevenue[d] = (dailyRevenue[d] || 0) + sessionSales.reduce((s, x) => s + x.total, 0);
  }

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  let html = `<div class="calendar">
    <div class="cal-header-row">
      <span style="font-weight:600">${year}年 ${monthNames[month]}</span>
    </div>
    <div class="cal-dow">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid">`;

  for (let i = 1; i < startDow; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  const today = todayStr();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rev = dailyRevenue[dateStr] || 0;
    const isToday = dateStr === today;
    html += `<div class="cal-cell${isToday ? ' today' : ''}${rev > 0 ? ' has-data' : ''}" data-date="${dateStr}">
      <span class="cal-day">${d}</span>
      ${rev > 0 ? `<span class="cal-rev">${fmtMoney(rev)}</span>` : ''}
    </div>`;
  }

  html += '</div></div>';
  return html;
}

  </div>`;

  // 谁点过这杯
  const recipeSales = getRecipeSales(id);
  const customerCounts = {};
  recipeSales.forEach(s => {
    const key = s.customerId || '散客';
    if (!customerCounts[key]) customerCounts[key] = { name: s.customerName, cups: 0 };
    customerCounts[key].cups += s.cups;
  });
  const customerList = Object.entries(customerCounts).sort((a, b) => b[1].cups - a[1].cups);

  html += '<div class="page-section"><div class="page-section-title">👥 谁点过这杯</div>';
  if (customerList.length === 0) {
    html += '<div class="empty-state" style="padding:12px"><div style="font-size:var(--font-sm)">还没有人点过</div></div>';
  } else {
    html += customerList.map(([cid, info]) => {
      const rating = DB.ratings.find(rt => rt.customerId === cid && rt.recipeId === id);
      const starHtml = renderStars(rating ? rating.stars : 0, cid, id);
      return `<div class="card">
        <div class="card-header">
          <span class="card-title">${escHtml(info.name)}</span>
          <span style="color:var(--text-secondary)">${info.cups}杯</span>
        </div>
        <div style="margin-top:4px">
          <span style="font-size:var(--font-sm);color:var(--text-secondary)">评价：</span>
          ${starHtml}
        </div>
        <div style="margin-top:4px">
          <input class="rating-note" data-customer="${cid}" data-recipe="${id}" placeholder="添加评价备注…" value="${escHtml(rating?.note || '')}" style="font-size:var(--font-sm)">
        </div>
      </div>`;
    }).join('');
  }
  html += '</div>';

  html += '<button class="btn btn-danger btn-block" style="margin-top:16px" id="rd-delete-btn">删除配方</button>';

  $('#rd-content').innerHTML = html;

  $('#rd-delete-btn').addEventListener('click', () => deleteRecipe(id));

  // 绑定星评事件
  $$('#rd-content .star').forEach(el => {
    el.addEventListener('click', function() {
      const customerId = this.dataset.customer;
      const recipeId = this.dataset.recipe;
      const stars = parseInt(this.dataset.stars);
      setRating(customerId, recipeId, stars);
      showRecipeDetail(id);
    });
  });

  // 绑定备注输入
  $$('#rd-content .rating-note').forEach(el => {
    el.addEventListener('change', function() {
      const customerId = this.dataset.customer;
      const recipeId = this.dataset.recipe;
      saveRatingNote(customerId, recipeId, this.value);
    });
  });
}

function renderStars(stars, customerId, recipeId) {
  let html = '<span class="stars">';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star ${i <= stars ? 'on' : ''}" data-stars="${i}" data-customer="${customerId}" data-recipe="${recipeId}">${i <= stars ? '★' : '☆'}</span>`;
  }
  html += '</span>';
  return html;
}

function setRating(customerId, recipeId, stars) {
  let r = DB.ratings.find(rt => rt.customerId === customerId && rt.recipeId === recipeId);
  if (r) {
    r.stars = stars;
    r.createdAt = new Date().toISOString();
  } else {
    DB.ratings.push({
      id: genId(),
      customerId,
      recipeId,
      stars,
      note: '',
      createdAt: new Date().toISOString()
    });
  }
  dbSave();
}

function saveRatingNote(customerId, recipeId, note) {
  let r = DB.ratings.find(rt => rt.customerId === customerId && rt.recipeId === recipeId);
  if (r) {
    r.note = note;
  } else {
    DB.ratings.push({
      id: genId(),
      customerId,
      recipeId,
      stars: 0,
      note,
      createdAt: new Date().toISOString()
    });
  }
  dbSave();
}

// ===== 自定义弹窗 =====
function showConfirm(msg, danger, callback) {
  $('#confirm-message').textContent = msg;
  $('#confirm-ok').className = danger ? 'btn btn-danger' : 'btn btn-primary';
  $('#confirm-ok').style.flex = '1';
  $('#modal-confirm').classList.add('open');
  $('#confirm-ok').onclick = function() {
    $('#modal-confirm').classList.remove('open');
    if (callback) callback();
  };
  $('#confirm-cancel').onclick = function() {
    $('#modal-confirm').classList.remove('open');
  };
}

function showAlert(msg) {
  $('#alert-message').textContent = msg;
  $('#modal-alert').classList.add('open');
  $('#alert-ok').onclick = function() {
    $('#modal-alert').classList.remove('open');
  };
}

// ===== 工具 =====
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Tab 切换 =====
function switchTab(tab) {
  $$('.tab-content').forEach(el => el.classList.remove('active'));
  $$('.tab-btn').forEach(el => el.classList.remove('active'));
  $(`#tab-${tab}`).classList.add('active');
  $(`.tab-btn[data-tab="${tab}"]`).classList.add('active');

  if (tab === 'tonight') renderTonight();
  else if (tab === 'customers') renderCustomers();
  else if (tab === 'recipes') renderRecipes();
  else if (tab === 'reports') renderReports();
}

    $('#btn-manual-drink').style.display = 'none';
    $('#manual-drink-input').style.display = 'block';

  $('#btn-cancel-manual').addEventListener('click', () => {

    $('#drink-grid').style.display = 'grid';
    $('#btn-manual-drink').style.display = 'block';
    $('#manual-drink-input').style.display = 'none';

    $('#manual-drink-price').value = '0';

  $('#btn-confirm-manual').addEventListener('click', () => {
    const name = $('#manual-drink-name').value.trim();

    if (!name) { showAlert('请输入酒名'); return; }

  $('#sale-back-to-step2').addEventListener('click', () => goToSaleStep(2));

    overlay.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

  });

// ===== 销售向导 =====
let saleData = {};

function openSaleWizard() {
  saleData = { editId: null, customerId: null, customerName: '散客', recipeId: null, recipeName: '', unitPrice: 0, cups: 1 };
  historyAddDate = null;
  goToSaleStep(1);
  $('#sale-title').textContent = '新增销售';
  $('#modal-sale').classList.add('open');
  renderCustomerGrid();
}

function openHistoryAddSale() {
  showConfirm('确定在这天补录一笔销售吗？这会改变过往营业报表数字。', true, () => {
    showConfirm('二次确认：确认补录？', true, () => {
      saleData = { editId: null, customerId: null, customerName: '散客', recipeId: null, recipeName: '', unitPrice: 0, cups: 1 };
      historyAddDate = historyDay;
      goToSaleStep(1);
      $('#sale-title').textContent = '补录销售 - ' + historyDay;
      $('#modal-sale').classList.add('open');
      renderCustomerGrid();
    });
  });
}

function closeSaleWizard() {
  $('#modal-sale').classList.remove('open');
  saleData.editId = null;
  historyAddDate = null;
}

function goToSaleStep(n) {
  $$('#sale-modal-inner .wizard-step').forEach(el => el.classList.remove('active'));
  $(`#sale-step${n}`).classList.add('active');
  if (n === 1) {
    $('#sale-title').textContent = '选择客人';
    renderCustomerGrid();
  } else if (n === 2) {
    $('#sale-title').textContent = '选择酒水';
    $('#drink-search').value = '';
    $('#drink-search').style.display = 'block';
    $('#drink-grid').style.display = 'grid';
    $('#btn-manual-drink').style.display = 'block';
    $('#manual-drink-input').style.display = 'none';
    $('#manual-drink-name').value = '';
    $('#manual-drink-price').value = '0';
    renderDrinkGrid('');
  } else if (n === 3) {
    $('#sale-title').textContent = '确认销售';
    $('#sale3-customer').textContent = saleData.customerName;
    $('#sale3-drink').textContent = saleData.recipeName;
    $('#sale-cups').textContent = '1';
    $('#sale-price').value = saleData.unitPrice;
    saleData.cups = 1;
    updateSaleTotal();
  }
}

function renderCustomerGrid() {
  let html = '<div class="wizard-item" data-customer-id="" data-customer-name="散客" style="grid-column:1/-1;background:rgba(255,107,53,0.15)">👤 散客</div>';

  // 最近消费的客人优先
  const recentCustomerIds = [];
  const seen = new Set();
  const sortedSales = DB.sales.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  for (const s of sortedSales) {
    if (s.customerId && !seen.has(s.customerId)) {
      seen.add(s.customerId);
      recentCustomerIds.push(s.customerId);
    }
  }

  const shown = new Set();
  for (const cid of recentCustomerIds.slice(0, CONFIG.maxRecentCustomers)) {
    const c = getCustomer(cid);
    if (c) {
      shown.add(cid);
      html += `<div class="wizard-item" data-customer-id="${c.id}" data-customer-name="${escHtml(c.name)}">${escHtml(c.name)}</div>`;
    }
  }

  // 补齐未显示的老客人
  for (const c of DB.customers) {
    if (!shown.has(c.id) && shown.size < CONFIG.maxRecentCustomers) {
      shown.add(c.id);
      html += `<div class="wizard-item" data-customer-id="${c.id}" data-customer-name="${escHtml(c.name)}">${escHtml(c.name)}</div>`;
    }
  }

  $('#customer-grid').innerHTML = html;
}

function renderDrinkGrid(search) {
  let recipes = DB.recipes;
  if (search) {
    const q = search.toLowerCase();
    recipes = recipes.filter(r => r.name.toLowerCase().includes(q) || (r.tags || []).some(t => t.toLowerCase().includes(q)));
  }

  // 按点单频次排序
  const orderCounts = {};
  DB.sales.forEach(s => {
    if (s.recipeId) orderCounts[s.recipeId] = (orderCounts[s.recipeId] || 0) + s.cups;
  });
  recipes = [...recipes].sort((a, b) => (orderCounts[b.id] || 0) - (orderCounts[a.id] || 0));

  const show = recipes.slice(0, CONFIG.maxRecentRecipes);

  if (show.length === 0) {
    $('#drink-grid').innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px">没有匹配的配方</div>';
  } else {
    $('#drink-grid').innerHTML = show.map(r => `
      <div class="wizard-item" data-recipe-id="${r.id}" data-recipe-name="${escHtml(r.name)}" data-price="${r.defaultPrice}">
        <div style="font-weight:600">${escHtml(r.name)}</div>
        <div style="font-size:var(--font-sm);color:var(--text-secondary)">${fmtMoney(r.defaultPrice)}</div>
      </div>
    `).join('');
  }
}

function updateSaleTotal() {
  const cups = parseInt($('#sale-cups').textContent) || 1;
  const price = parseFloat($('#sale-price').value) || 0;
  saleData.cups = cups;
  saleData.unitPrice = price;
  $('#sale-total').textContent = fmtMoney(cups * price);
}

function saveSale() {
  const session = getActiveSession();
  if (!session && !historyAddDate) { showAlert('请先开始营业'); closeSaleWizard(); return; }

  const cups = parseInt($('#sale-cups').textContent) || 1;
  const unitPrice = parseFloat($('#sale-price').value) || 0;

  if (!saleData.recipeName.trim()) { showAlert('请输入酒名'); return; }
  if (unitPrice <= 0) { showAlert('请输入有效单价'); return; }

  if (saleData.editId) {
    const sale = DB.sales.find(s => s.id === saleData.editId);
    if (sale) {
      sale.customerId = saleData.customerId || null;
      sale.customerName = saleData.customerName || '散客';
      sale.recipeId = saleData.recipeId || null;
      sale.recipeName = saleData.recipeName;
      sale.cups = cups;
      sale.unitPrice = unitPrice;
      sale.total = cups * unitPrice;
      sale.recipePriceAtSale = unitPrice;
      const recipe = saleData.recipeId ? getRecipe(saleData.recipeId) : null;
      sale.recipeCostAtSale = recipe ? recipe.estimatedCost : 0;
      sale.recipeProfitAtSale = unitPrice - sale.recipeCostAtSale;
    }
  } else {
    const recipe = saleData.recipeId ? getRecipe(saleData.recipeId) : null;
    const costAtSale = recipe ? recipe.estimatedCost : 0;
    const profitAtSale = unitPrice - costAtSale;
    let createdAt;
    let sessionId = session ? session.id : null;
    if (historyAddDate) {
      createdAt = new Date(historyAddDate + 'T20:00:00').toISOString();
    } else {
      createdAt = new Date().toISOString();
    }
    DB.sales.push({
      id: genId(),
      customerId: saleData.customerId || null,
      customerName: saleData.customerName || '散客',
      recipeId: saleData.recipeId || null,
      recipeName: saleData.recipeName,
      cups,
      unitPrice,
      total: cups * unitPrice,
      recipePriceAtSale: unitPrice,
      recipeCostAtSale: costAtSale,
      recipeProfitAtSale: profitAtSale,
      createdAt,
      sessionId,
      rating: null
    });
  }
  dbSave();
  closeSaleWizard();
  const isHistory = $('#page-day-history').classList.contains('open');
  if (historyAddDate) {
    historyAddDate = null;
    renderDayHistory();
  } else if (isHistory) {
    renderDayHistory();
  } else {
    renderTonight();
  }
}

function editSale(id) {
  const sale = DB.sales.find(s => s.id === id);
  if (!sale) return;

  saleData = {
    editId: id,
    customerId: sale.customerId,
    customerName: sale.customerName,
    recipeId: sale.recipeId,
    recipeName: sale.recipeName,
    unitPrice: sale.unitPrice,
    cups: sale.cups
  };

  $('#sale-title').textContent = '编辑销售';
  goToSaleStep(3);

  $('#sale3-customer').textContent = saleData.customerName;
  $('#sale3-drink').textContent = saleData.recipeName;
  $('#sale-cups').textContent = sale.cups;
  $('#sale-price').value = sale.unitPrice;
  updateSaleTotal();

  $('#modal-sale').classList.add('open');
}

function deleteSale(id) {
  showConfirm('删除这条销售记录吗？', true, () => {
    DB.sales = DB.sales.filter(s => s.id !== id);
    dbSave();
    deleteFromSupabase('sales', id);
    renderTonight();
  });
}

// ===== 客人表单 =====
function openCustomerForm(existing) {
  custFormTags = existing ? [...(existing.tags || [])] : [];
  $('#customer-form-id').value = existing ? existing.id : '';
  $('#customer-form-name').value = existing ? existing.name : '';
  $('#customer-form-notes').value = existing ? existing.notes || '' : '';
  $('#customer-form-title').textContent = existing ? '编辑客人' : '新增客人';
  $('#customer-form-tag-input').value = '';
  renderCustFormTags();
  $('#modal-customer').classList.add('open');
}

function renderCustFormTags() {
  $('#customer-form-tags').innerHTML = custFormTags.map(t =>
    `<span class="tag accent">${escHtml(t)}<span class="tag-remove" data-tag="${escHtml(t)}">&times;</span></span>`
  ).join('');

  $$('#customer-form-tags .tag-remove').forEach(el => {
    el.addEventListener('click', function() {
      custFormTags = custFormTags.filter(t => t !== this.dataset.tag);
      renderCustFormTags();
    });
  });
}

function saveCustomer() {
  const name = $('#customer-form-name').value.trim();
  if (!name) { showAlert('请输入客人名字'); return; }
  const id = $('#customer-form-id').value;

  if (id) {
    const c = getCustomer(id);
    if (c) {
      c.name = name;
      c.notes = $('#customer-form-notes').value.trim();
      c.tags = custFormTags;
    }
  } else {
    DB.customers.push({
      id: genId(),
      name,
      notes: $('#customer-form-notes').value.trim(),
      tags: custFormTags,
      createdAt: new Date().toISOString()
    });
  }
  dbSave();
  $('#modal-customer').classList.remove('open');
  renderCustomers();
}

// ===== 配方表单 =====
let recipeFormBaseTags = [];
let recipeFormFlavorTags = [];
let recipeFormCustomTags = [];

function openRecipeForm(existing) {
  recipeFormBaseTags = existing ? existing.tags.filter(t => BASE_LIQUORS.includes(t)) : [];
  recipeFormFlavorTags = existing ? existing.tags.filter(t => FLAVORS.includes(t)) : [];
  recipeFormCustomTags = existing ? existing.tags.filter(t => !BASE_LIQUORS.includes(t) && !FLAVORS.includes(t)) : [];

  $('#recipe-form-id').value = existing ? existing.id : '';
  $('#recipe-form-name').value = existing ? existing.name : '';
  $('#recipe-form-price').value = existing ? existing.defaultPrice : '';
  $('#recipe-form-cost').value = existing ? existing.estimatedCost ?? '' : '';
  $('#recipe-form-ingredients').value = existing ? existing.ingredients || '' : '';
  $('#recipe-form-steps').value = existing ? existing.steps || '' : '';
  $('#recipe-form-notes').value = existing ? existing.notes || '' : '';
  $('#recipe-form-title').textContent = existing ? '编辑配方' : '新增配方';
  $('#recipe-form-custom-tag').value = '';

  renderRecipeTagSelectors();
  $('#modal-recipe').classList.add('open');
}

function renderRecipeTagSelectors() {
  $('#recipe-form-base-tags').innerHTML = BASE_LIQUORS.map(t =>
    `<span class="tag ${recipeFormBaseTags.includes(t) ? 'active' : ''}" data-tag="${t}" data-cat="base">${t}</span>`
  ).join('');

  $('#recipe-form-flavor-tags').innerHTML = FLAVORS.map(t =>
    `<span class="tag ${recipeFormFlavorTags.includes(t) ? 'active' : ''}" data-tag="${t}" data-cat="flavor">${t}</span>`
  ).join('');

  $('#recipe-form-custom-tags').innerHTML = recipeFormCustomTags.map(t =>
    `<span class="tag accent">${escHtml(t)}<span class="tag-remove" data-tag="${escHtml(t)}" data-cat="custom">&times;</span></span>`
  ).join('');

  // 绑定标签点击
  $$('#recipe-form-base-tags .tag, #recipe-form-flavor-tags .tag').forEach(el => {
    el.addEventListener('click', function() {
      const tag = this.dataset.tag;
      const cat = this.dataset.cat;
      if (cat === 'base') {
        if (recipeFormBaseTags.includes(tag)) recipeFormBaseTags = recipeFormBaseTags.filter(t => t !== tag);
        else recipeFormBaseTags.push(tag);
      } else {
        if (recipeFormFlavorTags.includes(tag)) recipeFormFlavorTags = recipeFormFlavorTags.filter(t => t !== tag);
        else recipeFormFlavorTags.push(tag);
      }
      renderRecipeTagSelectors();
    });
  });

  $$('#recipe-form-custom-tags .tag-remove').forEach(el => {
    el.addEventListener('click', function() {
      recipeFormCustomTags = recipeFormCustomTags.filter(t => t !== this.dataset.tag);
      renderRecipeTagSelectors();
    });
  });
}

// 配方自定义标签输入
$('#recipe-form-custom-tag').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const v = this.value.trim();
    if (v && !recipeFormCustomTags.includes(v) && !recipeFormBaseTags.includes(v) && !recipeFormFlavorTags.includes(v)) {
      recipeFormCustomTags.push(v);
      renderRecipeTagSelectors();
    }
    this.value = '';
  }
});

function saveRecipe() {
  const name = $('#recipe-form-name').value.trim();
  const price = parseFloat($('#recipe-form-price').value);
  const cost = parseFloat($('#recipe-form-cost').value) || 0;
  if (!name) { showAlert('请输入酒名'); return; }
  if (isNaN(price) || price < 0) { showAlert('请输入有效价格'); return; }

  const tags = [...recipeFormBaseTags, ...recipeFormFlavorTags, ...recipeFormCustomTags];
  const id = $('#recipe-form-id').value;

  if (id) {
    const r = getRecipe(id);
    if (r) {
      r.name = name;
      r.defaultPrice = price;
      r.estimatedCost = cost;
      r.tags = tags;
      r.ingredients = $('#recipe-form-ingredients').value.trim();
      r.steps = $('#recipe-form-steps').value.trim();
      r.notes = $('#recipe-form-notes').value.trim();
    }
  } else {
    DB.recipes.push({
      id: genId(),
      name,
      defaultPrice: price,
      estimatedCost: cost,
      tags,
      ingredients: $('#recipe-form-ingredients').value.trim(),
      steps: $('#recipe-form-steps').value.trim(),
      notes: $('#recipe-form-notes').value.trim(),
      createdAt: new Date().toISOString()
    });
  }
  dbSave();
  $('#modal-recipe').classList.remove('open');
  renderRecipes();
}

const RECIPE_COSTS = {
  "Negroni": 12, "Dry Martini": 9, "Godfather": 9, "Highball": 10,
  "Gin & Tonic": 16, "Long Island Iced Tea": 15, "Daiquiri": 9,
  "Gimlet": 10, "Sidecar": 32, "Margarita": 12, "Whiskey Sour": 8,
  "Earl Grey Martini": 10, "Espresso Martini": 6, "Penicillin": 12,
  "Jungle Bird": 15, "Plum Mirage": 14
};

function guessCost(recipe) {
  if (!recipe || !recipe.name) return 0;
  for (const [key, cost] of Object.entries(RECIPE_COSTS)) {
    if (recipe.name.includes(key)) return cost;
  }
  return 0;
}

function migrateData() {
  let changed = false;

  // 配方：补 estimatedCost
  DB.recipes.forEach(r => {
    if (r.estimatedCost === undefined) { r.estimatedCost = guessCost(r); changed = true; }
  });

  // 销售记录：补冻结利润字段
  DB.sales.forEach(s => {
    if (s.recipePriceAtSale === undefined) {
      s.recipePriceAtSale = s.unitPrice;
      const recipe = s.recipeId ? getRecipe(s.recipeId) : null;
      s.recipeCostAtSale = recipe ? recipe.estimatedCost : (s.unitPrice * 0.3);
      s.recipeProfitAtSale = s.recipePriceAtSale - s.recipeCostAtSale;
      changed = true;
    }
    if (s.rating === undefined) { s.rating = null; changed = true; }
  });

  if (changed) dbSave();
}

async function init() {
  bindEvents();
  await loadFromSupabase();
  seedRecipes();
  migrateData();
  renderTonight();

  // 设置自定义日期默认值
  const today = todayStr();
  $('#report-date-from').value = today;
  $('#report-date-to').value = today;
}

init();
